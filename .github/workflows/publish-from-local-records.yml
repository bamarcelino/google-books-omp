name: Publish Google Books OMP v0.1.2.1 from verified ZIP records

on:
  push:
    paths:
      - '.bootstrap/TRIGGER-LOCAL-RECORDS'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct exact ZIP prefix and extract local records
        shell: bash
        run: |
          set -euo pipefail
          {
            cat .bootstrap/part-aa .bootstrap/part-ab .bootstrap/part-ac .bootstrap/part-ad .bootstrap/part-ae .bootstrap/part-af
            head -c 10000 .bootstrap/part-ag
            cat .bootstrap/fix-ag-b .bootstrap/part-ah .bootstrap/part-ai .bootstrap/rem-04 .bootstrap/rem-05
            cat .bootstrap/final-00 .bootstrap/final-01 .bootstrap/final-02 .bootstrap/final-03 .bootstrap/final-04 .bootstrap/final-05 .bootstrap/final-06 .bootstrap/final-07 .bootstrap/final-08
          } | LC_ALL=C tr -cd 'A-Za-z0-9+/=' > /tmp/googleBooks-prefix.b64
          test "$(wc -c < /tmp/googleBooks-prefix.b64)" -eq 249999
          printf '=' >> /tmp/googleBooks-prefix.b64
          base64 --decode /tmp/googleBooks-prefix.b64 > /tmp/googleBooks-prefix.bin

          python3 - <<'PY'
          import binascii
          import hashlib
          import os
          from pathlib import Path
          import struct
          import zlib

          raw = Path('/tmp/googleBooks-prefix.bin').read_bytes()
          out = Path('/tmp/googleBooks-extracted')
          if out.exists():
              import shutil
              shutil.rmtree(out)
          out.mkdir(parents=True)

          pos = 0
          entries = 0
          while raw[pos:pos+4] == b'PK\x03\x04':
              if pos + 30 > len(raw):
                  raise SystemExit('Truncated local header')
              sig, ver, flag, method, mtime, mdate, crc, csize, usize, nlen, xlen = struct.unpack_from('<I5H3I2H', raw, pos)
              if flag != 0:
                  raise SystemExit(f'Unsupported ZIP flag {flag} at entry {entries}')
              name_bytes = raw[pos+30:pos+30+nlen]
              name = name_bytes.decode('utf-8')
              if not name.startswith('googleBooks/') or '..' in Path(name).parts:
                  raise SystemExit(f'Unsafe ZIP path: {name}')
              data_start = pos + 30 + nlen + xlen
              data_end = data_start + csize
              if data_end > len(raw):
                  raise SystemExit(f'Truncated payload: {name}')
              payload = raw[data_start:data_end]
              if method == 0:
                  content = payload
              elif method == 8:
                  content = zlib.decompress(payload, -15)
              else:
                  raise SystemExit(f'Unsupported compression method {method}: {name}')
              if len(content) != usize:
                  raise SystemExit(f'Uncompressed size mismatch: {name}')
              if (binascii.crc32(content) & 0xffffffff) != crc:
                  raise SystemExit(f'CRC mismatch: {name}')

              target = out / name
              if name.endswith('/'):
                  target.mkdir(parents=True, exist_ok=True)
              else:
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(content)
              entries += 1
              pos = data_end

          if entries != 82:
              raise SystemExit(f'Expected 82 ZIP local entries, got {entries}')
          if pos != 185853:
              raise SystemExit(f'Expected central directory at byte 185853, got {pos}')
          if raw[pos:pos+4] != b'PK\x01\x02':
              raise SystemExit('Central directory signature not found after local records')

          root = out / 'googleBooks'
          rows = []
          for path in sorted(p for p in root.rglob('*') if p.is_file()):
              rel = path.relative_to(root).as_posix()
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              rows.append(f'{digest}  {rel}\n')
          manifest = ''.join(rows).encode('utf-8')
          manifest_digest = hashlib.sha256(manifest).hexdigest()
          if len(rows) != 59:
              raise SystemExit(f'Expected 59 source files, got {len(rows)}')
          expected = 'df3dacf1cd79e33384fc750ea7ec72f03c38c9e214715cc388b6155f80a8f964'
          if manifest_digest != expected:
              raise SystemExit(f'Source tree digest mismatch: {manifest_digest}')
          Path('/tmp/googleBooks-manifest.txt').write_bytes(manifest)
          print(f'Verified {entries} ZIP records, 59 source files, tree digest {manifest_digest}')
          PY

      - name: Prepare clean repository and installable assets
        shell: bash
        run: |
          set -euo pipefail
          cp -a /tmp/googleBooks-extracted/googleBooks/. ./
          rm -rf .bootstrap
          rm -f README.tmp
          rm -f .github/workflows/bootstrap.yml .github/workflows/bootstrap-clean.yml .github/workflows/bootstrap-diagnose.yml .github/workflows/publish-from-local-records.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

          cd /tmp/googleBooks-extracted
          zip -q -X -r /tmp/googleBooks-0.1.2.1.zip googleBooks
          tar -czf /tmp/googleBooks-0.1.2.1.tar.gz googleBooks
          cd - >/dev/null
          {
            sha256sum /tmp/googleBooks-0.1.2.1.zip
            sha256sum /tmp/googleBooks-0.1.2.1.tar.gz
          } | sed 's#/tmp/##' > /tmp/googleBooks-0.1.2.1-SHA256.txt

      - name: Commit verified public source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish Google Books OMP plugin v0.1.2.1"
          git push origin HEAD:main

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create v0.1.2.1 \
            /tmp/googleBooks-0.1.2.1.zip \
            /tmp/googleBooks-0.1.2.1.tar.gz \
            /tmp/googleBooks-0.1.2.1-SHA256.txt \
            --repo "${{ github.repository }}" \
            --target main \
            --title "Google Books Integration for OMP 0.1.2.1" \
            --notes "Initial public release of the Google Books / Google Play Books integration plugin for Open Monograph Press (OMP) 3.5.x. The committed source tree is verified byte-for-byte against the tested v0.1.2.1 package source. Includes ONIX 3.0 feeds, Google Books catalog discovery and synchronization, HTTP/HTTPS pull delivery, Google-provided SFTP Dropbox, publisher SFTP, FTP/FTPS, Google Cloud Storage, protected local export, encrypted recoverable transport secrets, authentication diagnostics, incremental delivery tracking, background jobs, multilingual dashboard, and automated validation tooling."
