name: Apply Google Books OMP v0.1.2.8 enrichment

on:
  push:
    branches:
      - fix/google-onix-enrichment-0.1.2.8
    paths:
      - '.github/workflows/apply-v0.1.2.8.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/google-onix-enrichment-0.1.2.8
          fetch-depth: 0
      - name: Apply source changes
        run: python3 tools/apply_v0128.py
      - name: Install validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y php-cli php-sqlite3 php-xml php-mbstring php-curl python3-lxml
      - name: Validate source
        run: bash tests/run_all.sh
      - name: Commit enriched release source
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add source-backed ONIX enrichments for v0.1.2.8'
          git push origin HEAD:fix/google-onix-enrichment-0.1.2.8
