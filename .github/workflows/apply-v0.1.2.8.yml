      'related edition ISBNs are not derived from actual OMP publication formats')
check('positiveIntegerFromFormat' in enrichment and "'frontMatter'" in enrichment and "'backMatter'" in enrichment,
      'OMP page/extents metadata is not mapped without guessing')
check('guessSubject' not in enrichment and 'guessPage' not in enrichment,
      'ONIX enrichment introduced synthetic metadata inference')
'''
          if needle not in s:
              raise SystemExit('package check insertion point not found')
          s = s.replace(needle, extra + needle, 1)
          p.write_text(s, encoding='utf-8')

          p = root / 'version.xml'
          s = p.read_text(encoding='utf-8').replace('<release>0.1.2.7</release>', '<release>0.1.2.8</release>')
          p.write_text(s, encoding='utf-8')
          p = root / 'classes/Api/GoogleBooksApiClient.php'
          s = p.read_text(encoding='utf-8').replace('GoogleBooksIntegrationForOMP/0.1.2.7', 'GoogleBooksIntegrationForOMP/0.1.2.8')
          p.write_text(s, encoding='utf-8')

          p = root / 'CHANGELOG.md'
          s = p.read_text(encoding='utf-8')
          entry = '''## 0.1.2.8 - 2026-08-27\n\n- Adds source-backed optional ONIX enrichment requested by Google Play Books without inventing metadata.\n- Exports explicit publisher BISAC (`SubjectSchemeIdentifier 10`) and Thema (`93`) codes when those fields are actually present and valid.\n- Exports OMP keywords/subjects/disciplines as ONIX keyword subjects (`SubjectSchemeIdentifier 20`) when no controlled classification is available.\n- Adds truthful `Extent` composites from explicit total-page metadata plus OMP front/back matter counts when available; no PDF page-count guessing is performed.\n- Adds `RelatedProduct` / relation code `06` for real ISBN-bearing alternative publication formats of the same monograph.\n- Reuses a source abstract from another available localized OMP value when the mapped publication-locale summary is empty.\n- Optional enrichments are validated when present but never made ingestion-blocking when the source metadata is absent.\n- Bumps the plugin and Google Books API User-Agent to 0.1.2.8; no database migration.\n\n'''
          p.write_text(entry + s, encoding='utf-8')

          p = root / 'RELEASE_NOTES_0.1.2.8.md'
          p.write_text('''# Google Books Integration for OMP 0.1.2.8\n\nThis maintenance release enriches Google ONIX with optional metadata requested during Google Play Books onboarding while preserving the rule that publisher metadata must never be fabricated.\n\n## Enrichment\n\n- Subject: explicit BISAC/Thema codes are exported only from explicit source fields; OMP keywords, subjects and disciplines are exported as ONIX keyword subjects.\n- Extent: explicit total page count and OMP front/back matter values are exported when present. The plugin does not guess PDF pagination.\n- RelatedProduct: other real ISBN-bearing publication formats of the same OMP monograph are linked as alternative formats.\n- Summary: an existing localized abstract can be used as a fallback when the publication-locale abstract is empty.\n\nAll previously validated commercial structures, free-of-charge handling, stable validation URL, complete-document guards and Google crawler transport behavior remain unchanged.\n''', encoding='utf-8')

          (root / '.github/workflows/apply-v0.1.2.8.yml').unlink()
          PY

      - name: Install validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y php-cli php-sqlite3 php-xml php-mbstring php-curl python3-lxml
      - name: Validate source
        run: bash tests/run_all.sh
      - name: Commit enriched release source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add source-backed ONIX enrichments for v0.1.2.8'
          git push origin HEAD:fix/google-onix-enrichment-0.1.2.8
