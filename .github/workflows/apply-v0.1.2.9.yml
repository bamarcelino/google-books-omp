name: Apply Google Play profile corrections v0.1.2.9

on:
  push:
    branches:
      - fix/google-play-profile-0.1.2.9
    paths:
      - '.github/workflows/apply-v0.1.2.9.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/google-play-profile-0.1.2.9
          fetch-depth: 0

      - name: Apply source changes
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/apply_v0129.py
          python3 .github/scripts/fix_tests_v0129.py

      - name: Install validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y php-cli php-sqlite3 php-xml php-mbstring php-curl python3-lxml

      - name: Run complete validation suite
        shell: bash
        run: |
          set -euo pipefail
          bash tests/run_all.sh

      - name: Commit corrected source
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-v0.1.2.9.yml .github/scripts/apply_v0129.py .github/scripts/fix_tests_v0129.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Align ONIX with strict Google Play profile v0.1.2.9'
          git push origin HEAD:fix/google-play-profile-0.1.2.9

# Retry after aligning the 150-product completeness fixture with Google Play A01 eligibility.
