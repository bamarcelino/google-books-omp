name: Publish Google Books OMP v0.1.2.2

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-0.1.2.2.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y php-cli php-sqlite3 php-xml php-mbstring php-curl python3-lxml

      - name: Reconstruct and apply verified 0.1.2.2 hardening patch
        shell: bash
        run: |
          set -euo pipefail
          for f in .release/0.1.2.2/patch-aa .release/0.1.2.2/patch-ab .release/0.1.2.2/patch-ac .release/0.1.2.2/patch-ad .release/0.1.2.2/patch-ae; do
            test -f "$f"
          done
          cat .release/0.1.2.2/patch-* | base64 --decode > /tmp/googleBooks-0.1.2.2.patch.gz
          echo 'dc8ebf26fbbc24de29a99be44a47296c0b9e125fddd6e6905ee8f7fa34a79c26  /tmp/googleBooks-0.1.2.2.patch.gz' | sha256sum -c -
          gzip -dc /tmp/googleBooks-0.1.2.2.patch.gz > /tmp/googleBooks-0.1.2.2.patch
          patch -p5 --forward --batch < /tmp/googleBooks-0.1.2.2.patch

          rm -rf .release
          rm -f .github/workflows/publish-0.1.2.2.yml

          find . -type f ! -path './.git/*' -print0 | sort -z | xargs -0 sha256sum > /tmp/googleBooks-0.1.2.2-repo-manifest.txt
          echo 'd53e0a82cd1b9973f94e750b2930f21dabc217cbcb062d93d7c7a052bcf8315f  /tmp/googleBooks-0.1.2.2-repo-manifest.txt' | sha256sum -c -
          grep -q '<release>0.1.2.2</release>' version.xml
          test -f .github/workflows/ci.yml
          test ! -e .github/workflows/publish-0.1.2.2.yml
          test ! -e .release

      - name: Validate source tree
        shell: bash
        run: |
          set -euo pipefail
          bash tests/run_all.sh

      - name: Build and revalidate release archives
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/googleBooks-release /tmp/googleBooks-zip-check /tmp/googleBooks-tar-check
          mkdir -p /tmp/googleBooks-release/googleBooks
          tar --exclude='./.git' --exclude='./.github' -cf - . | tar -xf - -C /tmp/googleBooks-release/googleBooks

          cd /tmp/googleBooks-release
          zip -q -X -r /tmp/googleBooks-0.1.2.2.zip googleBooks
          tar -czf /tmp/googleBooks-0.1.2.2.tar.gz googleBooks
          {
            sha256sum /tmp/googleBooks-0.1.2.2.zip
            sha256sum /tmp/googleBooks-0.1.2.2.tar.gz
          } | sed 's#/tmp/##' > /tmp/googleBooks-0.1.2.2-SHA256.txt

          mkdir -p /tmp/googleBooks-zip-check /tmp/googleBooks-tar-check
          unzip -q /tmp/googleBooks-0.1.2.2.zip -d /tmp/googleBooks-zip-check
          tar -xzf /tmp/googleBooks-0.1.2.2.tar.gz -C /tmp/googleBooks-tar-check

          cd /tmp/googleBooks-zip-check/googleBooks
          bash tests/run_all.sh
          cd /tmp/googleBooks-tar-check/googleBooks
          bash tests/run_all.sh
          diff -qr /tmp/googleBooks-zip-check/googleBooks /tmp/googleBooks-tar-check/googleBooks

          ! grep -RIE 'PAD1UN1|9UPS0KG|publicar\.claec\.org|press\.scientia\.international|AIza[0-9A-Za-z_-]{20,}|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY' /tmp/googleBooks-zip-check/googleBooks

      - name: Commit verified 0.1.2.2 source
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Harden Google Books OMP plugin v0.1.2.2'
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create annotated release tag
        shell: bash
        run: |
          set -euo pipefail
          git tag -a v0.1.2.2 '${{ steps.commit.outputs.sha }}' -m 'Google Books Integration for OMP 0.1.2.2'
          git push origin v0.1.2.2

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create v0.1.2.2 \
            /tmp/googleBooks-0.1.2.2.zip \
            /tmp/googleBooks-0.1.2.2.tar.gz \
            /tmp/googleBooks-0.1.2.2-SHA256.txt \
            --repo '${{ github.repository }}' \
            --verify-tag \
            --title 'Google Books Integration for OMP 0.1.2.2' \
            --notes 'Security and maintenance release. Encrypts the Google Books API key at rest with a dedicated AES-256-GCM envelope, migrates legacy plaintext API-key settings after successful reads, adds an explicit clear-key control, updates the API User-Agent, corrects release documentation, expands regression coverage, and installs permanent GitHub Actions CI. Multi-transport HTTP/HTTPS, Google SFTP Dropbox, publisher SFTP, FTP/FTPS, Google Cloud Storage and protected local export support remains unchanged.'

      - name: Improve repository topics when permitted
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          gh api --method PUT "repos/${{ github.repository }}/topics" \
            -H 'Accept: application/vnd.github+json' \
            -f 'names[]=omp' \
            -f 'names[]=open-monograph-press' \
            -f 'names[]=pkp' \
            -f 'names[]=google-books' \
            -f 'names[]=google-play-books' \
            -f 'names[]=onix' \
            -f 'names[]=onix-3' \
            -f 'names[]=academic-publishing' \
            -f 'names[]=open-source' \
            -f 'names[]=php'
          if [ "$?" -ne 0 ]; then
            echo 'Repository topics could not be changed with the workflow token; release remains valid.'
          fi
