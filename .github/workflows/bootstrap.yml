name: Bootstrap source release

on:
  push:
    paths:
      - '.bootstrap/READY'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify package
        shell: bash
        run: |
          set -euo pipefail
          {
            cat .bootstrap/part-aa .bootstrap/part-ab .bootstrap/part-ac .bootstrap/part-ad .bootstrap/part-ae .bootstrap/part-af
            head -c 10000 .bootstrap/part-ag
            cat .bootstrap/fix-ag-b .bootstrap/part-ah .bootstrap/part-ai .bootstrap/rem-04 .bootstrap/rem-05
            cat .bootstrap/final-00 .bootstrap/final-01 .bootstrap/final-02 .bootstrap/final-03 .bootstrap/final-04 .bootstrap/final-05 .bootstrap/final-06 .bootstrap/final-07 .bootstrap/final-08 .bootstrap/final-09
          } | tr -d '[:space:]' > /tmp/googleBooks-package.b64
          base64 --decode /tmp/googleBooks-package.b64 > /tmp/googleBooks-0.1.2.1.zip
          echo "0a6112f1482ae22d87a283cd51a0cf9aa6ae32faf84ae7f0626bed9b05881cb3  /tmp/googleBooks-0.1.2.1.zip" | sha256sum -c -
          rm -rf /tmp/googleBooks-extracted
          mkdir -p /tmp/googleBooks-extracted
          unzip -q /tmp/googleBooks-0.1.2.1.zip -d /tmp/googleBooks-extracted
          test -f /tmp/googleBooks-extracted/googleBooks/GoogleBooksPlugin.php
          test -f /tmp/googleBooks-extracted/googleBooks/version.xml
          grep -q '<release>0.1.2.1</release>' /tmp/googleBooks-extracted/googleBooks/version.xml

      - name: Prepare source tree and release artifacts
        shell: bash
        run: |
          set -euo pipefail
          cp -a /tmp/googleBooks-extracted/googleBooks/. ./
          tar -czf /tmp/googleBooks-0.1.2.1.tar.gz -C /tmp/googleBooks-extracted googleBooks
          {
            sha256sum /tmp/googleBooks-0.1.2.1.zip
            sha256sum /tmp/googleBooks-0.1.2.1.tar.gz
          } | sed 's#/tmp/##' > /tmp/googleBooks-0.1.2.1-SHA256.txt
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

      - name: Commit complete source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish Google Books OMP plugin v0.1.2.1"
          git push origin HEAD:main

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create v0.1.2.1 \
            /tmp/googleBooks-0.1.2.1.zip \
            /tmp/googleBooks-0.1.2.1.tar.gz \
            /tmp/googleBooks-0.1.2.1-SHA256.txt \
            --repo "${{ github.repository }}" \
            --target main \
            --title "Google Books Integration for OMP 0.1.2.1" \
            --notes "Initial public release of the Google Books / Google Play Books integration plugin for Open Monograph Press (OMP) 3.5.x. Includes ONIX 3.0 feeds, Google Books catalog discovery and synchronization, HTTP/HTTPS pull delivery, Google-provided SFTP Dropbox, publisher SFTP, FTP/FTPS, Google Cloud Storage, protected local export, encrypted recoverable transport secrets, feed authentication diagnostics, incremental delivery tracking, background jobs, multilingual dashboard, and automated validation tooling."
