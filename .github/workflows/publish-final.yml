name: Publish verified Google Books OMP v0.1.2.1

on:
  push:
    paths:
      - '.bootstrap/TRIGGER-FINAL'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify repaired segment and reconstruct exact ZIP prefix
        shell: bash
        run: |
          set -euo pipefail

          declare -A expected
          expected[ag-00]='61202b2da93c6c24fe780854b9854090a5cf44606743ba2098cb982f8b5889df'
          expected[ag-01]='1a903151d5fd6c4520d64dc1f4d45659bdbda9b966055609c1b3458a98ae039c'
          expected[ag-02]='c378fc6366b598e996119668584cb6f5949c7f798818232b61bf83fe8ef814fc'
          expected[ag-03]='2fb728599b24edf4ce6e937324f8aa7d95534b40adf1a03a43b560b0a13953f1'
          expected[ag-04]='1ed298f785dc853751a011f82c3815d39ef809210f98a467a000e1b7b33d9162'
          expected[ag-05]='3af9d0285f096cd945ea82fbd8e3c94635779f8b7f037473418341885f9a4066'
          expected[ag-06]='02078084688d6c6dc8b837962fe4d4a80a0743212599a1ba77f5ca2a7dc915ca'
          expected[ag-07]='f102e2b82fc06f072f6a38aa5629edd4b2ea978d03419ae65008e3646cc952ec'
          expected[ag-08a]='c0a757643a2f617767bed4ab4827c05e4bbbb2f35bf46310b918832cd689cee9'
          expected[ag-08b]='2bbec9e8030a18d2fa1438f39a756fe9f8d1deb7969740b8347d8304531184ba'
          expected[ag-09a]='dd2ad58105d18ecffc8ff4afb0f6e95002bc87eebc6601ea3487ba667cb2c80a'
          expected[ag-09b]='342b890cc5c81dd7eeab93c447c31fce40e3e771dfcede99c11abbf5da24a42b'

          for name in ag-00 ag-01 ag-02 ag-03 ag-04 ag-05 ag-06 ag-07 ag-08a ag-08b ag-09a ag-09b; do
            f=".bootstrap/$name"
            h=$(sha256sum "$f" | cut -d' ' -f1)
            echo "$name $h"
            test "$h" = "${expected[$name]}"
          done

          cat \
            .bootstrap/ag-00 .bootstrap/ag-01 .bootstrap/ag-02 .bootstrap/ag-03 \
            .bootstrap/ag-04 .bootstrap/ag-05 .bootstrap/ag-06 .bootstrap/ag-07 \
            .bootstrap/ag-08a .bootstrap/ag-08b .bootstrap/ag-09a .bootstrap/ag-09b \
            > /tmp/ag-head
          test "$(wc -c < /tmp/ag-head)" -eq 10000
          test "$(sha256sum /tmp/ag-head | cut -d' ' -f1)" = 'd2280a8858747395f0bb05295d36cc63b0320db0dc55b5947fb5bf9db3969c4a'

          {
            cat .bootstrap/part-aa .bootstrap/part-ab .bootstrap/part-ac .bootstrap/part-ad .bootstrap/part-ae .bootstrap/part-af
            cat /tmp/ag-head
            cat .bootstrap/fix-ag-b .bootstrap/part-ah .bootstrap/part-ai .bootstrap/rem-04 .bootstrap/rem-05
            cat .bootstrap/final-00 .bootstrap/final-01 .bootstrap/final-02 .bootstrap/final-03 .bootstrap/final-04 .bootstrap/final-05 .bootstrap/final-06 .bootstrap/final-07 .bootstrap/final-08
          } > /tmp/googleBooks-prefix.b64

          test "$(wc -c < /tmp/googleBooks-prefix.b64)" -eq 249999
          printf '=' >> /tmp/googleBooks-prefix.b64
          base64 --decode /tmp/googleBooks-prefix.b64 > /tmp/googleBooks-prefix.bin

      - name: Extract and verify exact tested source tree
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import binascii
          import hashlib
          from pathlib import Path
          import shutil
          import struct
          import zlib

          raw = Path('/tmp/googleBooks-prefix.bin').read_bytes()
          out = Path('/tmp/googleBooks-extracted')
          if out.exists():
              shutil.rmtree(out)
          out.mkdir(parents=True)

          pos = 0
          entries = 0
          while raw[pos:pos+4] == b'PK\x03\x04':
              if pos + 30 > len(raw):
                  raise SystemExit('Truncated ZIP local header')
              sig, ver, flag, method, mtime, mdate, crc, csize, usize, nlen, xlen = struct.unpack_from('<I5H3I2H', raw, pos)
              if flag != 0:
                  raise SystemExit(f'Unsupported ZIP flag {flag} at entry {entries}')
              name = raw[pos+30:pos+30+nlen].decode('utf-8')
              parts = Path(name).parts
              if not name.startswith('googleBooks/') or '..' in parts:
                  raise SystemExit(f'Unsafe ZIP path: {name}')
              data_start = pos + 30 + nlen + xlen
              data_end = data_start + csize
              if data_end > len(raw):
                  raise SystemExit(f'Truncated ZIP payload: {name}')
              payload = raw[data_start:data_end]
              if method == 0:
                  content = payload
              elif method == 8:
                  content = zlib.decompress(payload, -15)
              else:
                  raise SystemExit(f'Unsupported compression method {method}: {name}')
              if len(content) != usize:
                  raise SystemExit(f'Uncompressed size mismatch: {name}')
              if (binascii.crc32(content) & 0xffffffff) != crc:
                  raise SystemExit(f'CRC mismatch: {name}')

              target = out / name
              if name.endswith('/'):
                  target.mkdir(parents=True, exist_ok=True)
              else:
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(content)
              entries += 1
              pos = data_end

          if entries != 82:
              raise SystemExit(f'Expected 82 ZIP local entries, got {entries}')
          if pos != 185853:
              raise SystemExit(f'Expected central directory at byte 185853, got {pos}')
          if raw[pos:pos+4] != b'PK\x01\x02':
              raise SystemExit('Central directory signature not found')

          root = out / 'googleBooks'
          rows = []
          for path in sorted(p for p in root.rglob('*') if p.is_file()):
              rel = path.relative_to(root).as_posix()
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              rows.append(f'{digest}  {rel}\n')
          manifest = ''.join(rows).encode('utf-8')
          manifest_digest = hashlib.sha256(manifest).hexdigest()
          if len(rows) != 59:
              raise SystemExit(f'Expected 59 source files, got {len(rows)}')
          expected = 'df3dacf1cd79e33384fc750ea7ec72f03c38c9e214715cc388b6155f80a8f964'
          if manifest_digest != expected:
              raise SystemExit(f'Source tree digest mismatch: {manifest_digest}')
          Path('/tmp/googleBooks-source-manifest.txt').write_bytes(manifest)
          print(f'Verified {entries} ZIP records, {len(rows)} source files, tree digest {manifest_digest}')
          PY

          test -f /tmp/googleBooks-extracted/googleBooks/GoogleBooksPlugin.php
          test -f /tmp/googleBooks-extracted/googleBooks/README.md
          test -f /tmp/googleBooks-extracted/googleBooks/LICENSE
          test -f /tmp/googleBooks-extracted/googleBooks/version.xml
          grep -q '<release>0.1.2.1</release>' /tmp/googleBooks-extracted/googleBooks/version.xml

      - name: Replace staging repository with verified source
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/googleBooks-extracted/googleBooks/. ./

          cd /tmp/googleBooks-extracted
          zip -q -X -r /tmp/googleBooks-0.1.2.1.zip googleBooks
          tar -czf /tmp/googleBooks-0.1.2.1.tar.gz googleBooks
          cd - >/dev/null
          {
            sha256sum /tmp/googleBooks-0.1.2.1.zip
            sha256sum /tmp/googleBooks-0.1.2.1.tar.gz
          } | sed 's#/tmp/##' > /tmp/googleBooks-0.1.2.1-SHA256.txt

      - name: Commit verified public source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish Google Books OMP plugin v0.1.2.1"
          git push origin HEAD:main

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create v0.1.2.1 \
            /tmp/googleBooks-0.1.2.1.zip \
            /tmp/googleBooks-0.1.2.1.tar.gz \
            /tmp/googleBooks-0.1.2.1-SHA256.txt \
            --repo "${{ github.repository }}" \
            --target main \
            --title "Google Books Integration for OMP 0.1.2.1" \
            --notes "Initial public release of the Google Books / Google Play Books integration plugin for Open Monograph Press (OMP) 3.5.x. The committed source tree was verified byte-for-byte against the tested v0.1.2.1 package source before publication. Includes ONIX 3.0 feeds, Google Books catalog discovery and synchronization, HTTP/HTTPS pull delivery, Google-provided SFTP Dropbox, publisher SFTP, FTP/FTPS, Google Cloud Storage, protected local export, encrypted recoverable transport secrets, feed authentication diagnostics, incremental delivery tracking, background jobs, multilingual dashboard, and automated validation tooling."
