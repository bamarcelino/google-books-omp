name: Apply Google ONIX corrections v0.1.2.5

on:
  push:
    branches:
      - fix-google-onix-v0.1.2.5
    paths:
      - '.github/workflows/apply-v0.1.2.5.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y php-cli php-sqlite3 php-xml php-mbstring php-curl python3-lxml

      - name: Apply source patch
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/apply_v0125.py

      - name: Run complete test suite
        shell: bash
        run: |
          set -euo pipefail
          bash tests/run_all.sh

      - name: Commit verified corrections
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-v0.1.2.5.yml .github/apply_v0125.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Apply Google Play Books ONIX corrections v0.1.2.5'
          git push origin HEAD:fix-google-onix-v0.1.2.5
