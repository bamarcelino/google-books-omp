name: Verify Google Books OMP v0.1.2.4 Release

on:
  pull_request:

permissions:
  contents: read

jobs:
  verify-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify release metadata and assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view v0.1.2.4 --repo "$GITHUB_REPOSITORY" --json tagName,name,isDraft,isPrerelease,assets
          tmp=$(mktemp -d)
          gh release download v0.1.2.4 --repo "$GITHUB_REPOSITORY" --dir "$tmp"
          cd "$tmp"
          test -f googleBooks-0.1.2.4.zip
          test -f googleBooks-0.1.2.4.tar.gz
          test -f googleBooks-0.1.2.4-SHA256.txt
          cat googleBooks-0.1.2.4-SHA256.txt
          sha256sum -c googleBooks-0.1.2.4-SHA256.txt
          unzip -t googleBooks-0.1.2.4.zip >/dev/null
          tar -tzf googleBooks-0.1.2.4.tar.gz >/dev/null
          echo 'OK release metadata, checksums, ZIP and TAR.GZ'
