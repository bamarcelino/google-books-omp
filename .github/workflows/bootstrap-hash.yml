name: Hash Google Books bootstrap segments

on:
  push:
    paths:
      - '.bootstrap/TRIGGER-HASH'

permissions:
  contents: read

jobs:
  hash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hash exact segments used by publisher
        shell: bash
        run: |
          set -euo pipefail
          for f in .bootstrap/part-aa .bootstrap/part-ab .bootstrap/part-ac .bootstrap/part-ad .bootstrap/part-ae .bootstrap/part-af .bootstrap/fix-ag-b .bootstrap/part-ah .bootstrap/part-ai .bootstrap/rem-04 .bootstrap/rem-05 .bootstrap/final-00 .bootstrap/final-01 .bootstrap/final-02 .bootstrap/final-03 .bootstrap/final-04 .bootstrap/final-05 .bootstrap/final-06 .bootstrap/final-07 .bootstrap/final-08; do
            printf '%s ' "$f"
            sha256sum "$f" | cut -d' ' -f1
          done
          printf '.bootstrap/part-ag-head '
          head -c 10000 .bootstrap/part-ag | sha256sum | cut -d' ' -f1
